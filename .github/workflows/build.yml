name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Dependências do Sistema
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          wget \
          curl \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5:i386 \
          libstdc++6:i386 \
          libz1:i386 \
          libffi-dev \
          libssl-dev

    - name: Instalar Buildozer e Dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython virtualenv
        pip install --upgrade buildozer

    - name: Compilar APK com Buildozer
      env:
        HOME: ${{ github.workspace }}
      run: |
        buildozer -v android debug || (echo "=== ERRO ENCONTRADO NO BUILD ===" && tail -n 100 .buildozer/android/platform/build-*.log 2>/dev/null || true && exit 1)

    - name: Salvar APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-aplicativo-apk
        path: bin/*.apk
